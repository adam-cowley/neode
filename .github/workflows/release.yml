name: Release

# Runs only when a v* tag is pushed — nothing releases on branch pushes or
# PRs. Version bumps are manual: run `pnpm changeset version`, commit the
# result, then push the matching tag to release it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # A tag can point at any local commit, so gate like CI before releasing
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
