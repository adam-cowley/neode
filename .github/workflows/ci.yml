name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; releases run from release.yml on v* tag pushes only
permissions:
  contents: read

jobs:
  # Own job: type-aware linting is slow; don't gate the test matrix on it
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # AGENTS.md is generated from the source; fail when it is stale
      - run: pnpm docs:agents --check

      # Unused exports / dependencies fail the build (NTS-599)
      - run: pnpm knip

  # Typecheck, tests with coverage, build and package checks over the
  # supported Node line
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 cannot run the build toolchain (tsdown requires
        # ^22.18 || ^24.11 || >=26); the published dist is plain JS and
        # the package engines field keeps runtime support at >=20
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Coverage runs over the unit project only: the embedded backend's
      # native library is not available in the check job, and the package
      # project needs dist/ (built below). The thresholds in
      # vitest.config.ts are calibrated against exactly this suite.
      - run: pnpm test:coverage --project unit

      - run: pnpm build

      - run: pnpm test:package

      - run: pnpm check:package

      # The tarball must ship dist/ (git-dep installs depend on `prepare`)
      - name: Packed tarball includes dist/
        run: |
          # npm 10 (Node 22) still runs `prepare` for pack and its build output
          # lands on stdout, so read the file listing npm prints on stderr
          # rather than parsing --json.
          npm pack --dry-run 2> pack.txt > /dev/null
          for p in dist/index.mjs dist/index.cjs dist/index.d.mts; do
            grep -q " $p\$" pack.txt || { echo "missing $p"; cat pack.txt; exit 1; }
          done

  # Real Neo4j servers via Testcontainers, over the supported server line.
  # Relate (embedded) needs its FFI client built locally (cargo build -p
  # relate-ffi) — it is exercised by local runs, not CI.
  #
  # The 1.0 release gate (NTS-671): the 5.x line plus a PINNED current
  # community tag. No floating "latest" — bump the pin deliberately.
  # Memgraph is deliberately NOT here: over Bolt it rejects core emitted
  # reads (ORDER BY after a CALL subquery — keyset pagination, chunk, lazy,
  # sorted nested loads), so the "memgraph" claim is dropped rather than
  # gated on a vacuous matrix (NTS-671).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neo4j: ["5-community", "2026.10.2-community"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Integration tests (Neo4j ${{ matrix.neo4j }} via Testcontainers)
        run: pnpm test:integration
        env:
          OGM_TEST_BACKEND: container
          NEO4J_IMAGE: neo4j:${{ matrix.neo4j }}

  # Fails the build when a user-visible change has no changeset.
  # The Version PR consumes every changeset, so "no changesets found" is
  # its normal state — skip it on the release branch (changesets bot).
  # Docs-only PRs ship no user-visible change either: the check only runs
  # when the diff touches package-relevant files, and passes (not skips)
  # otherwise so the required check name always reports.
  changeset-status:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: package-diff
        run: |
          if git diff --name-only "origin/main...${{ github.sha }}" | grep -qE '^(src/|package\.json|pnpm-lock\.yaml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec changeset status --since=origin/main
        if: steps.package-diff.outputs.changed == 'true'

  # Optional: external Neo4j/Memgraph via secrets. Inert until
  # NEO4J_URI / NEO4J_USERNAME / NEO4J_PASSWORD are configured.
  neo4j:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check secrets
        id: secrets
        if: env.NEO4J_URI != '' && env.NEO4J_USERNAME != '' && env.NEO4J_PASSWORD != ''
        run: echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Integration tests (external Neo4j backend)
        if: steps.secrets.outputs.enabled == 'true'
        run: pnpm test:integration
        env:
          OGM_TEST_BACKEND: neo4j
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
