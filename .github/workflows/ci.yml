name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Releases are manual only — nothing publishes automatically on merge
  workflow_dispatch:

jobs:
  # Own job: type-aware linting is slow; don't gate the test matrix on it
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  # Typecheck, tests with coverage, build and package checks over the
  # supported Node line
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 cannot run the build toolchain (tsdown requires
        # ^22.18 || ^24.11 || >=26); the published dist is plain JS and
        # the package engines field keeps runtime support at >=20
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Coverage runs over the unit project only: the embedded backend's
      # native library is not available in the check job, and the package
      # project needs dist/ (built below). The thresholds in
      # vitest.config.ts are calibrated against exactly this suite.
      - run: pnpm test:coverage --project unit

      - run: pnpm build

      - run: pnpm test:package

      - run: pnpm check:package

      # The tarball must ship dist/ (git-dep installs depend on `prepare`)
      - name: Packed tarball includes dist/
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const f=JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(x=>x.path);for(const p of ['dist/index.mjs','dist/index.cjs','dist/index.d.mts'])if(!f.includes(p)){console.error('missing '+p);process.exit(1)}"

  # Real Neo4j servers via Testcontainers, over the supported server line.
  # Relate (embedded) needs its FFI client built locally (cargo build -p
  # relate-ffi) — it is exercised by local runs, not CI.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neo4j: ["5-community", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Integration tests (Neo4j ${{ matrix.neo4j }} via Testcontainers)
        run: pnpm test:integration
        env:
          OGM_TEST_BACKEND: container
          NEO4J_IMAGE: neo4j:${{ matrix.neo4j }}

  # Fails the build when a user-visible change has no changeset
  changeset-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec changeset status --since=origin/main

  # Optional: external Neo4j/Memgraph via secrets. Inert until
  # NEO4J_URI / NEO4J_USERNAME / NEO4J_PASSWORD are configured.
  neo4j:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        id: secrets
        if: env.NEO4J_URI != '' && env.NEO4J_USERNAME != '' && env.NEO4J_PASSWORD != ''
        run: echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Integration tests (external Neo4j backend)
        if: steps.secrets.outputs.enabled == 'true'
        run: pnpm test:integration
        env:
          OGM_TEST_BACKEND: neo4j
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}

  # Publishes to npm via Changesets + trusted publishing (OIDC — no
  # NPM_TOKEN secret). Runs on main after CI gates pass; a `next`
  # pre-release mode keeps stable users unaffected during the migration.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [lint, check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Publish (changesets)
        # v2.1.2 minimum: v1's reader cannot parse the v3 .changeset/pre/
        # layout (ENOENT .changeset/pre/changes.md after a Version PR merges)
        uses: changesets/action@v2.1.2
        with:
          # v2.1.2 renamed its inputs: version -> version-script, publish -> publish-script
          version-script: pnpm changeset version
          # npm publishing intentionally disabled (user policy: nothing on npm yet) —
          # re-add `publish-script: pnpm release` to go live
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
